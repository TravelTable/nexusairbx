<script>
const { defineAgentFlow, fromUIMessage } = AgentFlowUI;
defineAgentFlow();
const activity = document.getElementById('activity');
const payload = document.getElementById('payload');
const error = document.getElementById('import-error');
const empty = document.getElementById('empty');
const loader = document.getElementById('loader');
const file = document.getElementById('file');
const statuses = new Set(['streaming','idle','interrupted','error']);
function load(value) {
  if (!value || typeof value !== 'object') throw new TypeError('Expected a JSON object.');
  if (Array.isArray(value.events)) {
    if (!statuses.has(value.status)) throw new TypeError('AgentRun.status must be streaming, idle, interrupted, or error.');
    activity.run = value;
  } else {
    const status = statuses.has(value.status) ? value.status : 'idle';
    activity.run = fromUIMessage(value.message || value, { status, error: typeof value.error === 'string' ? value.error : undefined });
  }
  error.textContent = ''; empty.hidden = true; loader.open = false;
}
document.getElementById('render').addEventListener('click', () => {
  try { load(JSON.parse(payload.value)); } catch (reason) { error.textContent = reason.message || 'Unable to load message data.'; }
});
document.getElementById('browse').addEventListener('click', () => file.click());
file.addEventListener('change', async () => {
  const selected = file.files[0]; if (!selected) return;
  try {
    if (selected.size > 12 * 1024 * 1024) throw new Error('The inspector accepts JSON files up to 12 MB.');
    payload.value = await selected.text(); load(JSON.parse(payload.value));
  } catch (reason) { error.textContent = reason.message || 'Unable to read file.'; }
  finally { file.value = ''; }
});
document.getElementById('clear').addEventListener('click', () => {
  activity.run = null; payload.value = ''; error.textContent = ''; empty.hidden = false; loader.open = true;
});
// Integration hooks: feed actual snapshots from the host application's subscription.
window.agentFlow = activity;
window.updateAssistant = (message, status = 'idle') => {
  activity.run = fromUIMessage(message, { status }); empty.hidden = false;
  if (activity.run.events.length) { empty.hidden = true; loader.open = false; }
};
</script>
